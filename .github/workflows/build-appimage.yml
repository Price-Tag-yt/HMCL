name: Build HMCL AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile HMCL and package AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            wget \
            imagemagick \
            desktop-file-utils \
            fuse

      - name: Compile HMCL
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean makeExecutables

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          LAUNCHER=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.sh' \
            ! -name '*sources*' \
            -print -quit)

          if [ -z "$LAUNCHER" ]; then
            echo "ERROR: HMCL Linux launcher was not generated."
            find build/libs -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Using launcher: $LAUNCHER"

          cp "$LAUNCHER" AppDir/usr/bin/HMCL.sh
          chmod +x AppDir/usr/bin/HMCL.sh

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/HMCL.sh" "$@"
          EOF

          chmod +x AppDir/AppRun

          convert \
            -size 256x256 \
            xc:'#512da8' \
            -fill white \
            -gravity center \
            -font DejaVu-Sans-Bold \
            -pointsize 64 \
            -annotate 0 'HMCL' \
            AppDir/usr/share/icons/hicolor/256x256/apps/HMCL.png

          cp AppDir/usr/share/icons/hicolor/256x256/apps/HMCL.png \
            AppDir/HMCL.png

          cat > AppDir/HMCL.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HMCL
          Comment=Hello Minecraft Launcher
          Exec=HMCL
          Icon=HMCL
          Categories=Game;
          Terminal=false
          EOF

          cp AppDir/HMCL.desktop \
            AppDir/usr/share/applications/HMCL.desktop

          desktop-file-validate AppDir/HMCL.desktop

      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy-x86_64.AppImage

      - name: Generate AppImage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/HMCL.desktop \
            --icon-file AppDir/HMCL.png \
            --output appimage

          APPIMAGE=$(find . -maxdepth 1 \
            -type f -name '*.AppImage' \
            ! -name 'linuxdeploy*' \
            -print -quit)

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: AppImage was not generated."
            exit 1
          fi

          mv "$APPIMAGE" HMCL-Linux-x86_64.AppImage
          chmod +x HMCL-Linux-x86_64.AppImage

          file HMCL-Linux-x86_64.AppImage
          ls -lh HMCL-Linux-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: HMCL-Linux-AppImage
          path: HMCL-Linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
