name: Build HMCL AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile HMCL and package AppImage
    runs-on: ubuntu-22.04

    steps:
      # 1. Download source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Configure Java correctly
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Verify Java
      - name: Verify Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            file \
            desktop-file-utils \
            python3 \
            zlib1g

      # 5. Compile HMCL
      - name: Compile HMCL
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean makeExecutables

      # 6. Find the actual executable
      - name: Locate HMCL executable
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Generated HMCL files ==="

          find . -type f \
            \( -name 'HMCL-*.sh' \
            -o -name 'HMCL-*.jar' \
            -o -name 'HMCL-*.deb' \) \
            -not -path './.git/*' \
            -print

          LAUNCHER=$(find . -type f \
            -name 'HMCL-*.sh' \
            -not -path './.git/*' \
            -not -path './AppDir/*' \
            -print -quit)

          if [ -n "$LAUNCHER" ]; then
            echo "HMCL_LAUNCHER=$LAUNCHER" >> "$GITHUB_ENV"
            echo "HMCL_TYPE=script" >> "$GITHUB_ENV"
            echo "Using Linux launcher: $LAUNCHER"
          else
            JAR=$(find . -type f \
              -name 'HMCL-*.jar' \
              -not -path './.git/*' \
              -not -path './AppDir/*' \
              -print -quit)

            if [ -z "$JAR" ]; then
              echo "ERROR: No HMCL Linux launcher or JAR found."
              exit 1
            fi

            echo "HMCL_LAUNCHER=$JAR" >> "$GITHUB_ENV"
            echo "HMCL_TYPE=jar" >> "$GITHUB_ENV"
            echo "Using JAR fallback: $JAR"
          fi

      # 7. Create AppDir
      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          if [ "$HMCL_TYPE" = "script" ]; then
            cp "$HMCL_LAUNCHER" AppDir/usr/bin/HMCL.sh
            chmod +x AppDir/usr/bin/HMCL.sh
          else
            cp "$HMCL_LAUNCHER" AppDir/usr/bin/HMCL.jar
          fi

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          set -eu

          HERE="$(dirname "$(readlink -f "$0")")"

          if [ -x "$HERE/usr/bin/HMCL.sh" ]; then
            exec "$HERE/usr/bin/HMCL.sh" "$@"
          fi

          exec java -jar "$HERE/usr/bin/HMCL.jar" "$@"
          EOF

          chmod +x AppDir/AppRun

          cat > AppDir/HMCL.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HMCL
          GenericName=Minecraft Launcher
          Comment=Hello Minecraft Launcher
          Exec=AppRun
          Icon=HMCL
          Categories=Game;
          Terminal=false
          EOF

          cp AppDir/HMCL.desktop \
            AppDir/usr/share/applications/HMCL.desktop

          # Generate a simple 256x256 PNG icon using Python.
          python3 - <<'PY'
          import struct
          import zlib

          width = height = 256

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  row.extend((81, 45, 168))
              rows.append(bytes(row))

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB",
                  width, height, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(b"".join(rows)))
              + chunk(b"IEND", b"")
          )

          with open(
              "AppDir/usr/share/icons/hicolor/256x256/apps/HMCL.png",
              "wb"
          ) as f:
              f.write(png)
          PY

          cp AppDir/usr/share/icons/hicolor/256x256/apps/HMCL.png \
            AppDir/HMCL.png

          desktop-file-validate AppDir/HMCL.desktop

      # 8. Download AppImage packaging tool
      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy-x86_64.AppImage

      # 9. Generate the real AppImage
      - name: Generate AppImage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
        shell: bash
        run: |
          set -euo pipefail

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/HMCL.desktop \
            --icon-file AppDir/HMCL.png \
            --output appimage

          APPIMAGE=$(find . -maxdepth 1 \
            -type f \
            -name '*.AppImage' \
            ! -name 'linuxdeploy*' \
            -print -quit)

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No AppImage was generated."
            exit 1
          fi

          mv "$APPIMAGE" HMCL-Linux-x86_64.AppImage

          chmod +x HMCL-Linux-x86_64.AppImage

          echo "=== Final AppImage ==="
          file HMCL-Linux-x86_64.AppImage
          ls -lh HMCL-Linux-x86_64.AppImage
          sha256sum HMCL-Linux-x86_64.AppImage

      # 10. Upload final artifact
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: HMCL-Linux-AppImage
          path: HMCL-Linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
