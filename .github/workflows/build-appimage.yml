name: Build HMCL AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk file wget

      - name: Build HMCL
        run: |
          chmod +x gradlew
          ./gradlew makeExecutables

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          JAR=$(find build -type f -name '*.jar' \
            ! -name '*sources*' | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERREUR : aucun fichier JAR trouvé"
            exit 1
          fi

          cp "$JAR" AppDir/usr/bin/HMCL.jar

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec java -jar "$HERE/usr/bin/HMCL.jar" "$@"
          EOF

          chmod +x AppDir/AppRun

          cat > AppDir/usr/share/applications/HMCL.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HMCL
          Comment=Minecraft Launcher
          Exec=HMCL
          Icon=HMCL
          Categories=Game;
          Terminal=false
          EOF

          cp AppDir/usr/share/applications/HMCL.desktop AppDir/HMCL.desktop

          ln -s usr/share/applications/HMCL.desktop AppDir/HMCL.desktop.link

      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

      - name: Build AppImage
        run: |
          export ARCH=x86_64
          ./linuxdeploy \
            --appdir AppDir \
            --output appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: HMCL-AppImage
          path: '*.AppImage'
          if-no-files-found: error
